[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-runtime"
version = "0.1.0"
description = "A lightweight runtime for reliable multi-agent systems with integrated guardrails and evaluation."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Bharat Khanna", email = "khanna.bharat@gmail.com" }
]
dependencies = [
  "pydantic>=2.10,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
